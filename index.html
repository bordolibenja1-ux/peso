<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peso">
<link rel="manifest" href="manifest.webmanifest">
<title>Peso</title>
<style>
:root{
  --brand:#2563EB;--brand2:#7C3AED;--ok:#16A34A;--bad:#DC2626;
  --bg:#F4F6FB;--surface:#fff;--on:#0F172A;--muted:#64748B;--line:#DCE3EE;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0A1120;--surface:#131C2E;--on:#E6EDF7;--muted:#93A4BD;--line:#243149}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--on);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;padding:calc(env(safe-area-inset-top) + 28px) 22px 26px;
  border-radius:0 0 30px 30px}
.brand{font-size:11px;letter-spacing:.3em;opacity:.75;font-weight:700}
#greet{font-size:22px;font-weight:800;margin-top:6px}
#weightBlock{display:none}
.lbl{font-size:13px;opacity:.75;margin-top:20px}
.big{display:flex;align-items:flex-end;gap:8px}
.big b{font-size:52px;line-height:1;font-weight:800}
.big span{font-size:18px;opacity:.75;margin-bottom:8px}
.pill{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:99px;
  font-size:13px;font-weight:700;background:rgba(255,255,255,.2)}
#rem{font-size:14px;opacity:.8;margin-top:14px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:4px;transition:width .4s}
main{padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:20px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 4px}
.card p.sub{font-size:13px;color:var(--muted);margin:0 0 16px}
input{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);
  background:transparent;color:var(--on);font-size:16px;margin-bottom:12px}
input:focus{outline:none;border-color:var(--brand)}
button{width:100%;padding:16px;border:0;border-radius:16px;font-size:15px;
  font-weight:700;background:var(--brand);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--on)}
button.text{background:transparent;color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;width:auto;padding:10px 16px;border-radius:99px;font-size:13px;
  font-weight:600;background:transparent;border:1px solid var(--line);color:var(--on)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-bottom:8px}
.row .w{font-size:19px;font-weight:800}
.row .d{font-size:12px;color:var(--muted)}
.row .dl{margin-left:auto;font-weight:800;font-size:14px}
.empty{font-size:14px;color:var(--muted)}
.foot{display:flex;gap:10px;margin-bottom:24px}
.foot button{flex:1}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand">PESO</div>
  <div id="greet">Configurá tu perfil</div>
  <div id="weightBlock">
    <div class="lbl">Peso actual</div>
    <div class="big"><b id="cur">0.0</b><span>kg</span></div>
    <div id="delta" class="pill">—</div>
    <div id="rem">—</div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</header>
<main>
  <section id="setup" class="card">
    <h2>Tus datos</h2>
    <p class="sub">Se guardan solo en este iPhone</p>
    <input id="fName" placeholder="Nombre" autocomplete="name">
    <input id="fAge" placeholder="Edad" inputmode="numeric">
    <input id="fStart" placeholder="Peso inicial (kg)" inputmode="decimal">
    <input id="fGoal" placeholder="Peso objetivo (kg)" inputmode="decimal">
    <button id="bSave">Empezar</button>
  </section>

  <section id="dash" class="hide">
    <div class="card">
      <h2>Registrar pesaje</h2>
      <p class="sub">Se guarda con fecha y hora</p>
      <input id="fNew" placeholder="Peso de hoy (kg)" inputmode="decimal">
      <button id="bAdd">Guardar pesaje</button>
    </div>

    <div class="card">
      <h2>Recordatorio</h2>
      <p class="sub" id="intTxt">Cada 3 días</p>
      <div class="chips" id="chips">
        <button class="chip" data-d="1">1 día</button>
        <button class="chip" data-d="2">2 días</button>
        <button class="chip on" data-d="3">3 días</button>
        <button class="chip" data-d="7">7 días</button>
        <button class="chip" data-d="14">14 días</button>
      </div>
      <button class="ghost" id="bPerm" style="margin-top:14px">Activar notificaciones</button>
    </div>

    <div class="card">
      <h2>Historial</h2>
      <p class="empty" id="empty">Todavía no hay pesajes.</p>
      <div id="hist"></div>
    </div>

    <div class="foot">
      <button class="ghost" id="bExp">Exportar</button>
      <button class="ghost" id="bImp">Importar</button>
    </div>
    <button class="text" id="bReset" style="margin-bottom:24px">Borrar todo</button>
    <input id="fFile" type="file" accept="application/json" class="hide">
  </section>
</main>
<script>
const K='peso_v1';
const load=()=>JSON.parse(localStorage.getItem(K)||'null');
const save=s=>localStorage.setItem(K,JSON.stringify(s));
const fmt=v=>v.toFixed(1);
let S=load();

const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

function paint(){
  if(!S||!S.name){ $('setup').classList.remove('hide'); $('dash').classList.add('hide');
    $('weightBlock').style.display='none'; $('greet').textContent='Configurá tu perfil'; return; }
  $('setup').classList.add('hide'); $('dash').classList.remove('hide');
  $('weightBlock').style.display='block'; $('greet').textContent='Hola, '+S.name;

  const cur=S.records.length?S.records[S.records.length-1].w:S.start;
  const lost=S.start-cur, rem=cur-S.goal, baja=lost>=0;
  $('cur').textContent=fmt(cur);
  $('delta').textContent=(baja?'Bajaste ':'Subiste ')+fmt(Math.abs(lost))+' kg';
  $('delta').style.background=baja?'rgba(22,163,74,.85)':'rgba(220,38,38,.85)';
  $('rem').textContent=rem>0?'Faltan '+fmt(rem)+' kg para llegar a '+fmt(S.goal)+' kg'
    :'¡Objetivo de '+fmt(S.goal)+' kg alcanzado!';
  const span=S.start-S.goal;
  let pct=Math.abs(span)<.01?100:(S.start-cur)/span*100;
  $('bar').style.width=Math.max(0,Math.min(100,pct))+'%';

  $('intTxt').textContent='Cada '+S.interval+(S.interval===1?' día':' días');
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.d===S.interval));

  const h=$('hist'); h.innerHTML=''; $('empty').classList.toggle('hide',S.records.length>0);
  S.records.slice().reverse().slice(0,40).forEach((r,i,arr)=>{
    const row=document.createElement('div'); row.className='row';
    const left=document.createElement('div');
    left.innerHTML='<div class="w">'+fmt(r.w)+' kg</div><div class="d">'+r.t+'</div>';
    row.appendChild(left);
    const prev=S.records[S.records.indexOf(r)-1];
    if(prev){
      const d=r.w-prev.w, dl=document.createElement('div'); dl.className='dl';
      if(Math.abs(d)>=.05){ dl.textContent=(d>0?'+':'')+fmt(d);
        dl.style.color=d>0?'var(--bad)':'var(--ok)'; } else { dl.textContent='='; dl.style.color='var(--muted)'; }
      row.appendChild(dl);
    }
    h.appendChild(row);
  });
}

function due(){
  if(!S||!S.records.length) return false;
  const last=new Date(S.records[S.records.length-1].t).getTime();
  return Date.now()-last >= S.interval*86400000;
}

function maybeNotify(){
  if(!due()||!('Notification' in window)||Notification.permission!=='granted') return;
  const cur=S.records.length?S.records[S.records.length-1].w:S.start;
  const lost=S.start-cur;
  const body='Tu peso actual es '+fmt(cur)+' kg. '+(lost>=0?'Bajaste '+fmt(lost)+' kg.':'Subiste '+fmt(-lost)+' kg.');
  new Notification('Hora de pesarte, '+S.name,{body:body,icon:'icon.svg',tag:'peso'});
}

$('bSave').onclick=()=>{
  const name=$('fName').value.trim(), age=+$('fAge').value,
        st=parseFloat($('fStart').value.replace(',','.')),
        go=parseFloat($('fGoal').value.replace(',','.'));
  if(!name||!age||!st||!go) return alert('Completá todos los campos');
  if(st<20||st>400||go<20||go>400) return alert('Pesos fuera de rango');
  S={name:name,age:age,start:st,goal:go,interval:3,records:[{w:st,t:new Date().toISOString()}]};
  save(S); paint();
};

$('bAdd').onclick=()=>{
  const w=parseFloat($('fNew').value.replace(',','.'));
  if(!w) return alert('Ingresá tu peso');
  if(w<20||w>400) return alert('Peso fuera de rango');
  S.records.push({w:w,t:new Date().toISOString()}); save(S);
  $('fNew').value=''; paint(); maybeNotify();
};

$('chips').onclick=e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  S.interval=+c.dataset.d; save(S); paint();
};

$('bPerm').onclick=async()=>{
  if(!('Notification' in window)) return alert('Este iPhone no soporta notificaciones web');
  const p=await Notification.requestPermission();
  alert(p==='granted'?'Notificaciones activadas':'Permiso denegado en Safari');
};

$('bExp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='peso-backup.json'; a.click();
};

$('bImp').onclick=()=>$('fFile').click();
$('fFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ S=JSON.parse(r.result); save(S); paint(); }catch(_){ alert('Archivo inválido'); } };
  r.readAsText(f);
};

$('bReset').onclick=()=>{ if(confirm('¿Borrar todo?')){ localStorage.removeItem(K); S=null; paint(); } };

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
paint(); maybeNotify();
</script>
</body>
</html>
